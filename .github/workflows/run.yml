name: run

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Execute the notebook top to bottom
        run: jupyter nbconvert --to notebook --execute bank_marketing_spark.ipynb --output executed.ipynb --ExecutePreprocessor.timeout=3600
      - uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: executed.ipynb
